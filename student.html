<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5B21B6">
<title>الأمن السيبراني | جهاز المجموعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --p:#7C3AED; --p2:#8B5CF6; --pd:#5B21B6; --pdd:#2E1065;
  --ps:#EDE9FE; --pss:#F7F4FF; --line:#E4DCFB;
  --pink:#EC4899; --ok:#10B981; --okS:#E7FBF3; --bad:#F43F5E; --badS:#FFF0F3; --amber:#F59E0B;
  --ink:#2A1454; --muted:#6B5A8E;
  --shadow:0 18px 40px -18px rgba(76,29,149,.35);
  --shadow-s:0 8px 20px -10px rgba(76,29,149,.35);
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  --tc:#7C3AED; /* لون المجموعة */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(700px 500px at 105% -5%, #E9DDFF 0%, transparent 60%),
  radial-gradient(600px 450px at -5% 105%, #FDE3F1 0%, transparent 60%), #FBFAFF;
  background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea{font-family:inherit;font-size:20px;color:var(--ink)}

/* ---------- الشريط العلوي ---------- */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 18px;
  padding-top:max(12px,env(safe-area-inset-top));background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line)}
.h-team{display:flex;align-items:center;gap:8px;background:var(--tc);color:#fff;border-radius:999px;padding:6px 18px 6px 14px;font-weight:900;font-size:20px}
.h-team span{font-size:24px}
.h-pts{font-weight:900;color:var(--pd);background:var(--ps);border-radius:999px;padding:6px 14px;font-size:18px}
.h-pts b{direction:ltr;display:inline-block}
.h-sp{flex:1}
.h-conn{font-size:15px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.h-conn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--bad)}
.h-conn.on::before{background:var(--ok)}
.h-change{font-size:15px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:10px}
.h-change:active{background:var(--ps)}

main{max-width:900px;margin:0 auto;padding:22px 18px 40px}

/* ---------- بطاقة عامة ---------- */
.card{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:26px 26px 22px;border-top:10px solid var(--tc)}
.tag{display:inline-block;background:var(--pss);border:2px solid var(--line);color:var(--pd);padding:2px 16px;border-radius:999px;font-size:16px;font-weight:800}
.title{font-size:28px;font-weight:900;color:var(--pdd);line-height:1.35;margin:10px 0 6px}
.q{font-size:22px;font-weight:700;color:var(--muted);line-height:1.6;margin-bottom:18px}
.q b{color:var(--pd)}
.ctx{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px}
.ctx span{background:var(--ps);color:var(--pd);border-radius:999px;padding:4px 14px;font-weight:800;font-size:17px}
.mytask{background:var(--pss);border-right:8px solid var(--tc);border-radius:18px;padding:14px 18px;font-size:21px;font-weight:800;line-height:1.6;margin-bottom:16px}

/* ---------- الإرسال والحالة ---------- */
.foot{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.send{font-size:24px;font-weight:900;color:#fff;padding:16px;border-radius:999px;background:linear-gradient(135deg,var(--p2),var(--pd));
  box-shadow:0 12px 26px -10px rgba(109,40,217,.7);transition:transform .15s,opacity .2s}
.send:active{transform:scale(.97)}
.send:disabled{opacity:.45}
.send.sent{background:var(--ok);box-shadow:0 12px 26px -10px rgba(16,185,129,.7)}
.status{text-align:center;font-size:18px;font-weight:800;color:var(--muted);min-height:1.6em}
.status.ok{color:#059669}
.status.bad{color:var(--bad)}
.locked{display:flex;align-items:center;gap:10px;background:var(--ps);color:var(--pd);border-radius:18px;padding:12px 18px;font-weight:900;font-size:19px;margin-bottom:16px}
.score{margin-inline-start:auto;background:var(--pd);color:#fff;border-radius:999px;padding:2px 14px;direction:ltr}
.model{margin-top:16px;background:var(--okS);border-right:8px solid var(--ok);border-radius:18px;padding:14px 18px;font-size:19px;font-weight:700;line-height:1.7;color:#065F46}

/* ---------- اختيار من متعدد ---------- */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--pss);border:3px solid var(--line);border-radius:22px;
  padding:16px 18px;font-size:21px;font-weight:800;line-height:1.45;min-height:84px;transition:transform .15s,border-color .2s,background .2s}
.opt .ic{font-size:30px;flex:none}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--p);background:var(--ps);box-shadow:0 0 0 4px rgba(124,58,237,.18)}
.opt.right{border-color:var(--ok);background:var(--okS)}
.opt.wrong{border-color:var(--bad);background:var(--badS)}
.opt:disabled{cursor:default}
.emos{display:flex;justify-content:center;gap:20px}
.emo{font-size:64px;width:120px;height:120px;border-radius:30px;background:var(--pss);border:3px solid var(--line);transition:transform .15s}
.emo.sel{border-color:var(--p);background:var(--ps);transform:scale(1.08)}
.rate-msg{text-align:center;font-size:21px;font-weight:800;color:var(--pd);margin-top:16px}

/* ---------- حقول نصية ---------- */
textarea{width:100%;min-height:130px;border:3px solid var(--line);border-radius:20px;padding:14px 16px;line-height:1.6;resize:vertical;background:var(--pss);outline:none}
textarea:focus,.bl:focus,.idea-in input:focus{border-color:var(--p2);background:#fff}
textarea:disabled{opacity:.8}
.qs{display:flex;flex-direction:column;gap:18px}
.qi{background:var(--pss);border-radius:22px;padding:16px}
.qi-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qi-n{width:34px;height:34px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.qi-k{font-size:16px;font-weight:800;color:var(--pd)}
.qi-q{font-size:20px;font-weight:800;line-height:1.55;margin-bottom:10px}
.qi textarea{min-height:80px;background:#fff}
.qi .model{margin-top:10px;font-size:17px}

/* ---------- أكملي الفراغ ---------- */
.bl-text{font-size:23px;font-weight:700;line-height:2.4}
.bl{width:8.5em;border:3px dashed var(--p2);border-radius:14px;padding:2px 10px;font-size:20px;font-weight:800;text-align:center;background:var(--pss);outline:none;margin:0 4px}
.bl.right{border:3px solid var(--ok);background:var(--okS);color:#047857}
.bl.wrong{border:3px solid var(--bad);background:var(--badS);color:#BE123C}
.bl-fix{display:inline-block;font-size:16px;font-weight:900;color:#047857;background:var(--okS);border-radius:999px;padding:0 10px;margin-inline-start:2px}

/* ---------- الترتيب ---------- */
.ord-slots{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.ord-slot{display:flex;align-items:center;gap:12px;min-height:62px;border:3px dashed var(--line);border-radius:18px;padding:8px 14px;font-size:21px;font-weight:800;background:#fff;text-align:start}
.ord-slot .n{width:36px;height:36px;border-radius:50%;background:var(--ps);color:var(--pd);display:grid;place-items:center;font-weight:900;flex:none}
.ord-slot.fill{border-style:solid;border-color:var(--p2);background:var(--pss)}
.ord-slot.fill .n{background:var(--tc);color:#fff}
.ord-slot.right{border-color:var(--ok);background:var(--okS)}
.ord-slot.wrong{border-color:var(--bad);background:var(--badS)}
.ord-slot small{color:var(--muted);font-weight:700;font-size:15px;margin-inline-start:auto}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border:3px solid var(--line);border-radius:999px;padding:10px 20px;font-size:20px;font-weight:800;box-shadow:var(--shadow-s);transition:transform .15s}
.chip:active{transform:scale(.95)}
.hint{font-size:16px;font-weight:700;color:var(--muted);margin:6px 0 10px}
.mini{font-size:16px;font-weight:800;color:var(--pd);background:var(--ps);border-radius:999px;padding:6px 14px;margin-top:12px}

/* ---------- الاختيار المتعدد ---------- */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;align-items:center;gap:10px;background:var(--pss);border:3px solid var(--line);border-radius:20px;padding:14px 16px;font-size:20px;font-weight:800;text-align:start}
.pick span{font-size:28px}
.pick.sel{border-color:var(--p);background:var(--ps)}
.pick.sel::after{content:"✓";margin-inline-start:auto;color:var(--p);font-weight:900;font-size:24px}

/* ---------- التصنيف + صح/خطأ ---------- */
.rows{display:flex;flex-direction:column;gap:12px}
.row{background:var(--pss);border-radius:20px;padding:14px 16px;border:3px solid transparent}
.row.right{border-color:var(--ok);background:var(--okS)}
.row.wrong{border-color:var(--bad);background:var(--badS)}
.row-t{font-size:20px;font-weight:800;line-height:1.5;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.row-t .ic{font-size:26px}
.row-t .n{width:32px;height:32px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-weight:900;flex:none;font-size:17px}
.row-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rb{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px;font-size:19px;font-weight:800;transition:transform .15s}
.rb:active{transform:scale(.97)}
.rb.sel{border-color:var(--c,var(--p));background:var(--c,var(--p));color:#fff}
.why{margin-top:8px;font-size:16px;font-weight:700;color:#065F46}
.row.wrong .why{color:#9F1239}

/* ---------- العصف الذهني ---------- */
.idea-in{display:flex;gap:10px}
.idea-in input{flex:1;min-width:0;border:3px solid var(--line);border-radius:999px;padding:12px 20px;background:var(--pss);outline:none;font-weight:700}
.idea-in button{flex:none;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--p2),var(--pd));border-radius:999px;padding:0 26px}
.ideas{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.ideas span{background:#fff;border:3px solid var(--tc);color:var(--pdd);border-radius:999px;padding:6px 16px;font-size:19px;font-weight:800;animation:pop .4s}

/* ---------- شاشات الانتظار والدخول ---------- */
.center{text-align:center;padding:30px 10px}
.big-ic{font-size:96px;line-height:1.1;animation:floaty 3s ease-in-out infinite}
.center h1{font-size:34px;font-weight:900;color:var(--pdd);margin:14px 0 8px}
.center p{font-size:21px;color:var(--muted);font-weight:700;line-height:1.6}
.now{display:inline-block;margin-top:18px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 22px;font-weight:800;color:var(--pd);font-size:18px;box-shadow:var(--shadow-s)}
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--c);color:#fff;border-radius:24px;padding:18px 8px;box-shadow:var(--shadow-s);transition:transform .15s;position:relative}
.team:active{transform:scale(.95)}
.team .ic{font-size:44px;line-height:1.1}
.team b{font-size:21px;font-weight:900}
.team small{position:absolute;top:8px;left:10px;font-size:13px;font-weight:800;background:rgba(255,255,255,.3);border-radius:999px;padding:0 8px}

/* ---------- ⏱ المؤقت + ⭐ الذهبي + 🎉 الاحتفال ---------- */
.tbar{position:relative;height:48px;border-radius:999px;background:#FEF3C7;overflow:hidden;margin-bottom:16px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:21px;color:#92400E}
.tbar[hidden]{display:none}
.tbar i{position:absolute;top:0;bottom:0;right:0;background:#FCD34D;transition:width .25s linear}
.tbar span{position:relative}
.tbar.warn{background:var(--badS);color:var(--bad);animation:pulse 1s infinite}
.tbar.warn i{background:#FECDD3}
.tbar.end{background:var(--pdd);color:#fff}
@keyframes pulse{50%{transform:scale(1.02)}}
.card.timeup #body{pointer-events:none;opacity:.55;filter:grayscale(.3)}
.gold{display:inline-block;background:linear-gradient(135deg,#FDE68A,#F59E0B);color:#78350F;border-radius:999px;padding:2px 14px;font-weight:900;font-size:16px;
  margin-inline-start:8px;box-shadow:0 0 0 3px #FEF3C7;animation:pop .5s}
.h-rank{font-weight:900;color:#fff;background:var(--pdd);border-radius:999px;padding:6px 14px;font-size:16px}
.h-rank:empty{display:none}
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(46,16,101,.55);pointer-events:none;animation:fxOut 3s forwards}
.fx-box{background:#fff;border-radius:34px;padding:30px 54px;text-align:center;box-shadow:var(--shadow);animation:pop .5s;max-width:88vw}
.fx-box .e{font-size:96px;line-height:1.1}
.fx-box b{display:block;font-size:36px;font-weight:900;color:var(--pdd);margin-top:6px}
.fx-box small{display:block;font-size:20px;color:var(--muted);font-weight:700;margin-top:4px}
@keyframes fxOut{0%,78%{opacity:1}100%{opacity:0}}
.fly{position:fixed;top:-60px;z-index:51;pointer-events:none;font-size:42px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{50%{transform:translateY(-12px)}}
.enter{animation:pop .45s}

@media (max-width:640px){
  .opts,.picks{grid-template-columns:1fr}
  .teams{grid-template-columns:repeat(2,1fr)}
  .title{font-size:24px}.q{font-size:19px}
  .emo{width:90px;height:90px;font-size:48px}
}
</style>
</head>
<body>

<header id="hdr" hidden>
  <div class="h-team" id="hTeam"></div>
  <div class="h-pts">🏆 <b id="hPts">0</b></div>
  <div class="h-rank" id="hRank"></div>
  <div class="h-sp"></div>
  <div class="h-conn" id="hConn">غير متصل</div>
  <button class="h-change" id="hChange">تغيير المجموعة</button>
</header>
<main id="view"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="lesson.js"></script>
<script src="live-common.js"></script>
<script>
/* ==========================================================================
   📱 صفحة جهاز المجموعة — تتبع شريحة المعلمة وتعرض سؤالها وترسل الإجابة
   ========================================================================== */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const T = LESSON.teams, esc = LIVE.esc, view = $('#view');
const KEY = 'team:' + LIVE.room;
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const clone = v => v==null ? v : JSON.parse(JSON.stringify(v));

let team = null;
try { const t = localStorage.getItem(KEY); if (t !== null && T[+t]) team = +t; } catch(e) {}

const st = { slide:null, task:null, sent:null, loaded:false, revealed:false, revLoaded:false, draft:null, ideas:[], mix:[], timer:null, timeUp:false };
let subs = [], presence = {}, presRef = null, liveStarted = false;
const listen = (r, ev, fn) => { r.on(ev, fn); subs.push(() => r.off(ev, fn)); };

/* ---------------- شاشات عامة ---------------- */
function screen(icon, title, text, extra=''){
  view.innerHTML = `<div class="card center enter"><div class="big-ic">${icon}</div><h1>${title}</h1><p>${text}</p>${extra}</div>`;
}

function renderJoin(){
  $('#hdr').hidden = true;
  view.innerHTML = `<div class="card center enter" style="--tc:var(--p)">
      <div class="big-ic">🛡️</div><h1>${LESSON.title}</h1><p>اختاري مجموعتكِ للبدء 👇</p>
      <div class="teams">${T.map((t,k)=>`<button class="team" data-k="${k}" style="--c:${t.color}">
        ${presence[k]?`<small>📱 ${presence[k]}</small>`:''}<span class="ic">${t.icon}</span><b>${t.name}</b></button>`).join('')}</div>
      <p style="margin-top:22px;font-size:16px">الغرفة: <b dir="ltr">${esc(LIVE.room)}</b></p></div>`;
  $$('.team').forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (presence[k] && !confirm(`يوجد جهاز متصل باسم مجموعة «${T[k].name}». هل تريدين المتابعة؟`)) return;
    team = k; try { localStorage.setItem(KEY, k); } catch(e) {}
    enterTeam();
  });
}

/* ---------------- الدخول باسم المجموعة ---------------- */
let teamSubs = [];
function enterTeam(){
  const t = T[team];
  document.documentElement.style.setProperty('--tc', t.color);
  $('#hTeam').innerHTML = `<span>${t.icon}</span>${t.name}`;
  $('#hdr').hidden = false;
  screen('⏳', 'جاري الاتصال…', 'لحظات من فضلكِ');

  // تسجيل الجهاز كمتصل (يُحذف تلقائيًا عند انقطاع الاتصال)
  presRef = LIVE.ref('presence/' + team).push();
  const onConn = c => { if (c && presRef) { presRef.onDisconnect().remove(); presRef.set(true); } };
  const connRef = firebase.database().ref('.info/connected');
  const connFn = s => onConn(!!s.val());
  connRef.on('value', connFn); teamSubs.push(() => connRef.off('value', connFn));

  let prevPts = null;
  const pts = LIVE.ref('scores'), ptsFn = s => {
    const all = s.val() || {}, mine = +all[team] || 0;
    const rank = 1 + T.filter((_, k) => k !== team && (+all[k] || 0) > mine).length;
    $('#hPts').textContent = mine;
    $('#hRank').textContent = mine > 0 ? (rank === 1 ? '👑 المركز الأول' : `المركز ${rank}`) : '';
    if (prevPts !== null && mine > prevPts) { showFx('🏅', `+${mine - prevPts} ${mine - prevPts > 1 ? 'نقاط' : 'نقطة'} لمجموعتكنّ!`, rank === 1 ? 'أنتنّ في الصدارة 👑' : `ترتيبكنّ الآن: ${rank}`); rain(); }
    prevPts = mine;
  };
  pts.on('value', ptsFn); teamSubs.push(() => pts.off('value', ptsFn));

  const live = LIVE.ref('live'), liveFn = s => {
    const v = s.val();
    if (!v || v.slide == null) { liveStarted = false; st.slide = null; subs.forEach(f => f()); subs = []; screen('👩‍🏫', 'بانتظار المعلمة', 'سيظهر السؤال هنا عندما تبدأ المعلمة العرض'); return; }
    liveStarted = true; onSlide(+v.slide);
  };
  live.on('value', liveFn); teamSubs.push(() => live.off('value', liveFn));
}

function leaveTeam(){
  teamSubs.forEach(f => f()); teamSubs = [];
  subs.forEach(f => f()); subs = [];
  if (presRef) { presRef.onDisconnect().cancel(); presRef.remove(); presRef = null; }
  team = null; st.slide = null;
  try { localStorage.removeItem(KEY); } catch(e) {}
  document.documentElement.style.removeProperty('--tc');
  renderJoin();
}
$('#hChange').onclick = () => { if (confirm('تغيير المجموعة على هذا الجهاز؟')) leaveTeam(); };

/* ---------------- تغيّر الشريحة ---------------- */
function emptyDraft(t){
  switch (t.kind) {
    case 'texts': return t.items.map(() => '');
    case 'blanks': return t.words.map(() => '');
    case 'order': case 'pick': return [];
    case 'sort': case 'tf': return {};
    case 'text': case 'ideas': return '';
  }
  return null;
}

function onSlide(n){
  if (n === st.slide) return;
  subs.forEach(f => f()); subs = [];
  const s = SLIDES[n], t = LIVE.taskFor(s);
  Object.assign(st, { slide:n, task:t, sent:null, loaded:false, revealed:false, revLoaded:false, ideas:[], timer:null, timeUp:false, draft: t ? emptyDraft(t) : null });
  if (!t) {
    screen('👀', 'تابعي الشاشة', 'لا يوجد سؤال الآن… استمعي للمعلمة وشاركي في النقاش',
      s && s.title ? `<div class="now">📍 ${LIVE.strip(s.type==='title'?LESSON.title:s.title)}</div>` : '');
    return;
  }
  st.mix = shuffle((t.items || []).map((_, k) => k));
  render();
  listen(LIVE.ref(`answers/${n}/${team}`), 'value', snap => {
    const a = snap.val(); st.sent = a;
    if (!st.loaded) { st.loaded = true; if (a && a.v != null) { st.draft = mergeDraft(t, a.v); render(); return; } }
    updateFoot();
  });
  listen(LIVE.ref(`reveal/${n}`), 'value', snap => {
    const r = !!snap.val(), first = !st.revLoaded; st.revLoaded = true;
    if (r !== st.revealed) { st.revealed = r; render(); if (r && !first) cheer(); }
  });
  listen(LIVE.ref(`timer/${n}`), 'value', snap => { st.timer = snap.val(); tick(); });
  if (t.kind === 'ideas') listen(LIVE.ref(`ideas/${n}`), 'child_added', snap => {
    const d = snap.val() || {}; if (d.team !== team) return;
    st.ideas.push(d.text); drawIdeas();
  });
}

// قيم Firebase قد تصل كمصفوفة أو كائن — نعيدها لشكل المسودة
function mergeDraft(t, v){
  const d = emptyDraft(t);
  if (Array.isArray(d) && t.kind !== 'order' && t.kind !== 'pick') { d.forEach((_, i) => { if (v[i] != null) d[i] = v[i]; }); return d; }
  if (t.kind === 'order' || t.kind === 'pick') return Object.values(v || {}).map(Number);
  if (t.kind === 'sort' || t.kind === 'tf') { const o = {}; Object.keys(v || {}).forEach(k => { if (v[k] != null) o[k] = v[k]; }); return o; }
  return clone(v);
}

/* ---------------- عرض السؤال ---------------- */
function render(){
  const s = SLIDES[st.slide], t = st.task, R = st.revealed, g = R && st.sent ? LIVE.grade(t, st.sent.v) : null;
  const lockBar = R ? `<div class="locked">🔒 كشفت المعلمة الإجابة${g?`<span class="score">${g.ok} / ${g.total}</span>`:''}</div>` : '';
  const mine = t.perTeam ? `<div class="mytask">🎯 مهمة مجموعتكِ: ${t.perTeam[team] || 'مهمة حرة تحددها المعلمة'}</div>` : '';
  const ctx = t.context ? `<div class="ctx">${t.context.map(c => `<span>${c}</span>`).join('')}</div>` : '';
  const needSend = !['rate', 'ideas'].includes(t.kind);
  // بعد الكشف نعرض الإجابة المُرسلة فعلًا (لا المسودة غير المرسلة)
  const d = R ? (st.sent && st.sent.v != null ? mergeDraft(t, st.sent.v) : emptyDraft(t)) : st.draft;
  const lockT = st.timeUp && !R;
  view.innerHTML = `<div class="card enter ${lockT ? 'timeup' : ''}">
      ${lockBar}<div class="tbar" id="tbar" hidden><i></i><span></span></div>
      ${s.tag ? `<span class="tag">${s.tag}</span>` : ''}${s.points > 1 ? `<span class="gold">⭐ سؤال ذهبي × ${s.points}</span>` : ''}
      <h1 class="title">${s.title || ''}</h1>
      ${t.q && !t.perTeam ? `<div class="q">${t.q}</div>` : ''}${mine}${ctx}
      <div id="body">${BODY[t.kind] ? BODY[t.kind](t, d, R) : ''}</div>
      ${R && t.model ? `<div class="model">💡 ${t.model}</div>` : ''}
      <div class="foot">${needSend && !R && !lockT ? `<button class="send" id="send">📤 إرسال الإجابة</button>` : ''}<div class="status" id="status"></div></div>
    </div>`;
  BIND[t.kind] && BIND[t.kind](t, R || lockT);
  const send = $('#send'); if (send) send.onclick = submit;
  updateFoot(); tick();
}

function updateFoot(){
  const stEl = $('#status'), send = $('#send'), t = st.task; if (!stEl || !t) return;
  if (t.kind === 'ideas') { stEl.className = 'status'; stEl.textContent = st.ideas.length ? `أرسلتنّ ${st.ideas.length} فكرة 💡` : ''; return; }
  if (st.timeUp && !st.revealed) {
    stEl.className = 'status ' + (st.sent ? 'ok' : 'bad');
    stEl.textContent = st.sent ? '⏰ انتهى الوقت — إجابتكنّ وصلت ✅ انتظرن الكشف' : '⏰ انتهى الوقت ولم تُرسَل إجابة';
    return;
  }
  if (st.revealed) {
    stEl.className = 'status ' + (st.sent ? 'ok' : 'bad');
    stEl.textContent = st.sent ? '✅ تم استلام إجابتكنّ' : 'لم تُرسَل إجابة لهذا السؤال';
    return;
  }
  if (st.sent) {
    stEl.className = 'status ok'; stEl.textContent = '✅ وصلت إجابتكنّ للمعلمة — يمكنكنّ التعديل قبل الكشف';
    if (send) { send.classList.add('sent'); send.textContent = '🔁 تحديث الإجابة'; }
  } else if (send) { send.classList.remove('sent'); send.textContent = '📤 إرسال الإجابة'; }
}

function flash(msg){ const s = $('#status'); if (s) { s.className = 'status bad'; s.textContent = msg; } }

function validate(t, d){
  switch (t.kind) {
    case 'choice': return d != null || 'اختاري إجابة أولًا';
    case 'text':   return !!String(d).trim() || 'اكتبي إجابتكنّ أولًا';
    case 'texts': case 'blanks': return d.some(x => String(x).trim()) || 'اكتبي إجابة واحدة على الأقل';
    case 'order':  return d.length === t.items.length || 'رتّبي جميع العناصر أولًا';
    case 'pick':   return d.length > 0 || 'اختاري عنصرًا واحدًا على الأقل';
    case 'sort': case 'tf': return Object.keys(d).length === t.items.length || 'أجيبي عن جميع العناصر';
  }
  return true;
}

function submit(){
  const t = st.task, ok = st.timeUp ? '⏰ انتهى الوقت' : validate(t, st.draft);
  if (ok !== true) { flash(ok); return; }
  const v = (t.kind === 'text') ? String(st.draft).trim()
          : (t.kind === 'texts' || t.kind === 'blanks') ? st.draft.map(x => String(x).trim()) : clone(st.draft);
  const btn = $('#send'); btn.disabled = true;
  LIVE.ref(`answers/${st.slide}/${team}`).set({ v, t: LIVE.ts() })
    .catch(e => flash('تعذّر الإرسال، حاولي مرة أخرى'))
    .finally(() => { const b = $('#send'); if (b) b.disabled = false; });
}

/* ---------------- قوالب الأسئلة ---------------- */
const BODY = {
  choice: (t, d, R) => `<div class="opts">${t.options.map((o, k) => {
      const cls = R ? (k === t.answer ? 'right' : (k === d ? 'wrong' : '')) : (k === d ? 'sel' : '');
      return `<button class="opt ${cls}" data-k="${k}" ${R?'disabled':''}><span class="ic">${o.icon||''}</span><span>${o.t}</span></button>`; }).join('')}</div>`,

  rate: (t, d) => `<div class="emos">${t.items.map((r, k) => `<button class="emo ${k===d?'sel':''}" data-k="${k}">${r.e}</button>`).join('')}</div>
      <div class="rate-msg">${d != null && t.items[d] ? t.items[d].m : ''}</div>`,

  text: (t, d, R) => `<textarea id="ta" placeholder="اكتبن إجابة المجموعة هنا…" ${R?'disabled':''}>${esc(d)}</textarea>`,

  texts: (t, d, R) => `<div class="qs">${t.items.map((it, i) => `<div class="qi"><div class="qi-h"><span class="qi-n">${i+1}</span><span class="qi-k">${it.label||''}</span></div>
      <div class="qi-q">${it.q}</div><textarea data-i="${i}" placeholder="الإجابة…" ${R?'disabled':''}>${esc(d[i])}</textarea>
      ${R && it.a ? `<div class="model">💡 ${it.a}</div>` : ''}</div>`).join('')}</div>`,

  blanks: (t, d, R) => { let i = -1;
    return `<p class="bl-text">${t.text.replace(/\[(.+?)\]/g, (_, w) => { i++;
      const ok = R && LIVE.norm(d[i]) === LIVE.norm(w);
      return `<input class="bl ${R?(ok?'right':'wrong'):''}" data-i="${i}" value="${esc(d[i])}" placeholder="${i+1}" autocomplete="off" autocorrect="off" ${R?'disabled':''}>${R&&!ok?`<span class="bl-fix">${w}</span>`:''}`; })}</p>`; },

  order: (t, d, R) => `<div class="hint">${R ? 'الترتيب الصحيح موضّح بالأخضر' : 'اضغطي على العناصر بالترتيب الصحيح، واضغطي على أي عنصر مرتّب لإزالته'}</div>
      <div class="ord-slots">${t.items.map((_, i) => { const it = t.items[d[i]];
        const cls = it ? 'fill' + (R ? (d[i] === i ? ' right' : ' wrong') : '') : '';
        return `<button class="ord-slot ${cls}" data-i="${i}" ${R||!it?'disabled':''}><span class="n">${i+1}</span>${it ? `${it.icon} ${it.t}` : ''}${R && d[i] !== i ? `<small>✓ ${t.items[i].icon} ${t.items[i].t}</small>` : ''}</button>`; }).join('')}</div>
      ${R ? '' : `<div class="pool">${st.mix.filter(k => !d.includes(k)).map(k => `<button class="chip" data-k="${k}">${t.items[k].icon} ${t.items[k].t}</button>`).join('')}</div>
      ${d.length ? '<button class="mini" id="ordReset">↺ إعادة الترتيب</button>' : ''}`}`,

  pick: (t, d, R) => `<div class="picks">${t.items.map((a, k) => `<button class="pick ${d.includes(k)?'sel':''}" data-k="${k}" ${R?'disabled':''}><span>${a.icon}</span>${a.t}</button>`).join('')}</div>`,

  sort: (t, d, R) => `<div class="rows">${st.mix.map(i => { const it = t.items[i], v = d[i];
      const cls = R ? (v === it.b ? 'right' : 'wrong') : '';
      return `<div class="row ${cls}"><div class="row-t"><span class="ic">${it.icon||''}</span><span>${it.t}</span></div>
        <div class="row-b">${t.buckets.map(b => `<button class="rb ${v===b.key?'sel':''}" data-i="${i}" data-b="${b.key}" style="--c:${b.color}" ${R?'disabled':''}>${b.icon} ${b.label}</button>`).join('')}</div>
        ${R && v !== it.b ? `<div class="why">✓ الصحيح: ${t.buckets.find(b => b.key === it.b).label}</div>` : ''}</div>`; }).join('')}</div>`,

  tf: (t, d, R) => `<div class="rows">${t.items.map((it, i) => { const v = d[i];
      const cls = R ? (v === it.a ? 'right' : 'wrong') : '';
      return `<div class="row ${cls}"><div class="row-t"><span class="n">${i+1}</span><span>${it.t}</span></div>
        <div class="row-b"><button class="rb ${v===true?'sel':''}" data-i="${i}" data-v="1" style="--c:var(--ok)" ${R?'disabled':''}>✔ صح</button>
        <button class="rb ${v===false?'sel':''}" data-i="${i}" data-v="0" style="--c:var(--bad)" ${R?'disabled':''}>✖ خطأ</button></div>
        ${R && it.why ? `<div class="why">${it.why}</div>` : ''}</div>`; }).join('')}</div>`,

  ideas: (t, d, R) => `${R ? '' : `<div class="idea-in"><input id="ideaIn" maxlength="28" placeholder="اكتبي فكرة واحدة…" autocomplete="off"><button id="ideaSend">＋ إرسال</button></div>
      <div class="hint">كل فكرة تظهر مباشرة على شاشة المعلمة بلون مجموعتكنّ ✨</div>`}<div class="ideas" id="ideas"></div>`
};

const BIND = {
  choice: (t, R) => { if (R) return; $$('.opt').forEach(b => b.onclick = () => { st.draft = +b.dataset.k; $$('.opt').forEach(o => o.classList.toggle('sel', o === b)); }); },
  rate: t => $$('.emo').forEach(b => b.onclick = () => {
    st.draft = +b.dataset.k; $$('.emo').forEach(o => o.classList.toggle('sel', o === b));
    $('.rate-msg').textContent = t.items[st.draft].m;
    LIVE.ref(`answers/${st.slide}/${team}`).set({ v: st.draft, t: LIVE.ts() });
  }),
  text: () => { const ta = $('#ta'); if (ta) ta.oninput = () => st.draft = ta.value; },
  texts: () => $$('textarea[data-i]').forEach(ta => ta.oninput = () => st.draft[+ta.dataset.i] = ta.value),
  blanks: () => $$('.bl').forEach(inp => inp.oninput = () => st.draft[+inp.dataset.i] = inp.value),
  order: (t, R) => { if (R) return;
    $$('.chip').forEach(c => c.onclick = () => { st.draft.push(+c.dataset.k); render(); });
    $$('.ord-slot.fill').forEach(s => s.onclick = () => { st.draft.splice(+s.dataset.i, 1); render(); });
    const r = $('#ordReset'); if (r) r.onclick = () => { st.draft = []; render(); };
  },
  pick: (t, R) => { if (R) return; $$('.pick').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, i = st.draft.indexOf(k); i < 0 ? st.draft.push(k) : st.draft.splice(i, 1); b.classList.toggle('sel', i < 0); }); },
  sort: (t, R) => { if (R) return; $$('.rb').forEach(b => b.onclick = () => {
    st.draft[b.dataset.i] = b.dataset.b; $$(`.rb[data-i="${b.dataset.i}"]`).forEach(o => o.classList.toggle('sel', o === b)); }); },
  tf: (t, R) => { if (R) return; $$('.rb').forEach(b => b.onclick = () => {
    st.draft[b.dataset.i] = b.dataset.v === '1'; $$(`.rb[data-i="${b.dataset.i}"]`).forEach(o => o.classList.toggle('sel', o === b)); }); },
  ideas: (t, R) => {
    drawIdeas(); if (R) return;
    const inp = $('#ideaIn'), go = () => {
      const text = inp.value.trim(); if (!text) return;
      LIVE.ref(`ideas/${st.slide}`).push({ team, text, t: LIVE.ts() }); inp.value = ''; inp.focus();
    };
    $('#ideaSend').onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  }
};

/* ⏱ المؤقت المتزامن مع المعلمة */
setInterval(tick, 250);
function tick(){
  const bar = $('#tbar'), tm = st.timer;
  if (!tm || !st.task) { if (bar) bar.hidden = true; if (st.timeUp) { st.timeUp = false; render(); } return; }
  const ms = tm.end - LIVE.now(), left = Math.ceil(ms / 1000);
  if (left > 0 && st.timeUp) { st.timeUp = false; render(); return; }
  if (left <= 0 && !st.timeUp && !st.revealed) { st.timeUp = true; render(); return; }
  if (!bar) return;
  bar.hidden = st.revealed;
  bar.classList.toggle('warn', left > 0 && left <= 5);
  bar.classList.toggle('end', left <= 0);
  $('i', bar).style.width = Math.max(0, Math.min(100, ms / (tm.sec * 10))) + '%';
  $('span', bar).textContent = left > 0 ? `⏱ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '⏰ انتهى الوقت!';
}

/* 🎉 الاحتفال عند الكشف وعند كسب النقاط */
function showFx(e, title, sub){
  const d = document.createElement('div'); d.className = 'fx';
  d.innerHTML = `<div class="fx-box"><div class="e">${e}</div><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3100);
}
function rain(n = 26){
  const em = ['🎉','✨','⭐','💜','🎊', T[team] ? T[team].icon : '🛡️'];
  for (let i = 0; i < n; i++) {
    const f = document.createElement('span'); f.className = 'fly'; f.textContent = em[i % em.length];
    f.style.left = Math.random() * 100 + 'vw'; f.style.animationDelay = Math.random() * .6 + 's'; f.style.fontSize = 28 + Math.random() * 26 + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 3400);
  }
}
function cheer(){
  const t = st.task, a = st.sent, g = a ? LIVE.grade(t, a.v) : null;
  if (t.kind === 'rate' || t.kind === 'ideas') return;
  if (!a) return showFx('⏳', 'لم ترسلن إجابة هذه المرة', 'السؤال القادم لكنّ 💪');
  if (!g) return showFx('✅', 'كشفت المعلمة الإجابة', 'قارنّ إجابتكنّ بالإجابة النموذجية 👇');
  if (g.ok === g.total) { showFx('🎉', 'إجابة صحيحة!', `أحسنتنّ يا مجموعة ${T[team].name} ${T[team].icon}`); rain(); }
  else if (g.ok > 0) showFx('👏', `${g.ok} من ${g.total} صحيحة`, 'قريبات جدًا… ركّزن في التالي!');
  else showFx('💪', 'لا بأس!', 'راجعن الإجابة الصحيحة… والسؤال القادم لكنّ');
}

function drawIdeas(){ const box = $('#ideas'); if (box) box.innerHTML = st.ideas.map(x => `<span>${esc(x)}</span>`).join(''); updateFoot(); }

/* ---------------- البداية ---------------- */
if (!LIVE.ok) {
  LIVE.why === 'config'
    ? screen('🔧', 'الربط غير مُعدّ بعد', 'يجب لصق بيانات مشروع Firebase في ملف <b>firebase-config.js</b>')
    : screen('📶', 'لا يوجد اتصال بالإنترنت', 'تأكدي من اتصال الآيباد بالشبكة ثم أعيدي تحميل الصفحة',
        '<div style="margin-top:20px"><button class="send" style="padding:12px 40px" onclick="location.reload()">↻ إعادة التحميل</button></div>');
} else {
  screen('⏳', 'جاري الاتصال…', 'لحظات من فضلكِ');
  LIVE.ready.then(() => {
    if (LIVE.authError) { screen('⚠️', 'تعذّر الدخول', 'فعّلي خيار <b>Anonymous</b> في Firebase ← Authentication ← Sign-in method'); return; }
    LIVE.onConn(c => { const el = $('#hConn'); el.classList.toggle('on', c); el.textContent = c ? 'متصل' : 'غير متصل'; });
    LIVE.ref('presence').on('value', s => {
      const v = s.val() || {}; presence = {};
      Object.keys(v).forEach(k => presence[k] = Object.keys(v[k] || {}).length);
      if (team === null) renderJoin();
    });
    team === null ? renderJoin() : enterTeam();
  });
}
</script>
</body>
</html>
